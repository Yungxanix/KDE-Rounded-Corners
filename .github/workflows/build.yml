name: FinalRun

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
  pull_request:

env:
  BUILD_TYPE: Release

jobs:
  archlinux:
    runs-on: ubuntu-latest

    container:
      image: archlinux:base-devel
      options: --user root

    steps:
      - name: Update system
        run: |
          pacman -Syu --noconfirm

      - name: Install dependencies
        run: |
          pacman -S --needed --noconfirm \
            base-devel \
            git \
            cmake \
            ninja \
            extra-cmake-modules \
            kwin \
            vulkan-headers

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake \
            -B build \
            -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE}

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Install
        run: |
          DESTDIR="${PWD}/install" \
          cmake --install build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KDE-Rounded-Corners-Arch
          path: install
